<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="agent-rules — Markdown rules, applied to diffs by an agent">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect x="2" y="2" width="1196" height="296" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- left: wordmark + tagline -->
  <text class="mono" x="64" y="98" font-size="18" fill="#58a6ff" letter-spacing="3">@casa/agent-rules</text>
  <text class="mono" x="61" y="162" font-size="58" font-weight="700" fill="#e6edf3">agent-rules</text>
  <text class="sans" x="64" y="206" font-size="20" fill="#8b949e">Markdown rules, applied to diffs by an agent.</text>
  <text class="sans" x="64" y="234" font-size="20" fill="#8b949e">Catches what a linter can't — like a removed guard.</text>

  <!-- right: a diff "window" -->
  <rect x="712" y="70" width="424" height="160" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="734" cy="94" r="5" fill="#f85149"/>
  <circle cx="752" cy="94" r="5" fill="#d29922"/>
  <circle cx="770" cy="94" r="5" fill="#3fb950"/>

  <!-- review lens -->
  <circle cx="1098" cy="94" r="13" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <line x1="1108" y1="104" x2="1119" y2="115" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>

  <!-- diff lines -->
  <text class="mono" x="734" y="135" font-size="16" fill="#8b949e">  deleteAccount(id) {</text>

  <rect x="716" y="143" width="416" height="24" rx="3" fill="#f85149" opacity="0.13"/>
  <text class="mono" x="734" y="160" font-size="16" fill="#f85149">- if (!isAdmin) throw 403</text>

  <rect x="716" y="171" width="416" height="24" rx="3" fill="#3fb950" opacity="0.11"/>
  <text class="mono" x="734" y="188" font-size="16" fill="#3fb950">+ return db.delete(id)</text>

  <text class="mono" x="734" y="214" font-size="16" fill="#8b949e">  }</text>
</svg>
